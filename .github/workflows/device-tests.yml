name: Device acceptance and store screenshots
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['android/**', '.github/workflows/device-tests.yml']
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '36'
            image: '36'
            target: google_apis
          - api: '37.0'
            image: '37.0'
            target: google_apis_ps16k
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Enable runner KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Native tests and screenshots
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.image }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: |
            android/gradlew -p android :app:connectedDebugAndroidTest --no-daemon
            mkdir -p .work/screenshots
            adb pull /sdcard/Android/data/io.github.sigmasd.foldercamera.debug/files/store-screenshots .work/screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-results-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            .work/screenshots/
          retention-days: 30
